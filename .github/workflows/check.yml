name: Check Google Play Updates

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:    # Позволяет запускать проверку вручную по кнопке на GitHub

permissions:
  contents: write       # Разрешаем роботу сохранять обновленный data.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотеки парсера
        run: pip install google-play-scraper

      - name: Запуск проверки игр
        run: python update.py

      - name: Сохранение результата в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Автообновление данных Google Play" && git push)
